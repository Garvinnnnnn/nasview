name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'unsigned-*'

jobs:
  build-unsigned:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned IPA
        run: bash scripts/build_ios_unsigned.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NodePulse-unsigned-IPA
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 30
